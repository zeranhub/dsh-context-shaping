# dsh-context-surgery over the shipped Web composition: it inserts its own Host
# row (the /context command, the context_* tools, and the message API the
# per-message buttons call). The package's `dsh.client` section carries the
# browser half, registered by the id that equals the package name.

- insert:
    - id: context-surgery
      name: 'dsh-context-surgery'
      config: {}
